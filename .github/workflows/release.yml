name: Release

# Runs on every push to main. Own concurrency group (not keyed on github.ref)
# so a release run is never cancelled mid-push: a half-pushed tag/changelog
# commit is the worst outcome.
#
# Commitlint is a blocking first step: a non-conventional pushed commit fails
# the job before semantic-release runs.
on:
  push:
    branches: [main]

permissions:
  contents: write # create tags/releases and push the changelog commit
  issues: write # comment on released issues
  pull-requests: write # comment on released PRs

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Mint a release token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so commit analysis sees every commit
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Lint pushed commits
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            # New branch / no prior ref: lint just the latest commit.
            pnpm exec commitlint --from "HEAD~1" --to "HEAD" --verbose
          else
            pnpm exec commitlint --from "$BEFORE" --to "$AFTER" --verbose
          fi

      # The binary the release carries. musl rather than glibc: the box this
      # ships to is somebody's VPS, and a glibc build refuses to start on any
      # distro older than the runner's. libgit2 and OpenSSL are already
      # vendored, so the result needs nothing on the box but a kernel.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      # Built before semantic-release, which attaches it: the asset has to
      # exist by the time the GitHub release is published.
      - name: Build the worker
        run: cargo build --locked --release --target x86_64-unknown-linux-musl

      - name: Release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: pnpm release
