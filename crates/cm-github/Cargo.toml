[package]
name = "cm-github"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
async-trait = "0.1"
keyring = "4"
http = "1"
octocrab = "0.54"
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6"
